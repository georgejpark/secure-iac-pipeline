# Pre-commit hooks. Install once per clone:
#     pip install pre-commit && pre-commit install
#
# This is the cheapest gate in the whole pipeline. A secret caught here never
# becomes a commit, which means it never needs a history rewrite, a rotation,
# or an incident report. Everything downstream is a more expensive version of
# this check.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      # These two rewrite file CONTENT. Never let them near a binary: they strip
      # trailing bytes and append a newline, which corrupts a zip container.
      # A .docx is a zip. Found the hard way -- the first Word export committed
      # was unopenable.
      - id: end-of-file-fixer
        exclude: '\.(docx|xlsx|pptx|png|jpe?g|gif|pdf|zip|gz|tgz|ico|woff2?)$'
      - id: trailing-whitespace
        exclude: '\.(docx|xlsx|pptx|png|jpe?g|gif|pdf|zip|gz|tgz|ico|woff2?)$'
      - id: check-yaml
        args: [--allow-multiple-documents]
