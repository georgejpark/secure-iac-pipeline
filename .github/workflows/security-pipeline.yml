name: Security Pipeline

# Gates every change to the claims platform before it can reach an AWS account.
#
# Two properties this pipeline is designed around:
#
#   1. Secret scanning runs FIRST and ALONE. A leaked credential is already an
#      incident by the time CI sees it; a Terraform misconfiguration is still
#      only a proposal. They do not deserve the same urgency.
#
#   2. There are NO long-lived AWS credentials anywhere in this repository.
#      Authentication is GitHub OIDC federation -- GitHub mints a short-lived
#      token, AWS trusts it for one specific repo/branch, and it expires in an
#      hour. There is nothing in `secrets` for an attacker to steal.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, stage, prod]
      deploy:
        description: "Apply, not just scan"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.5.7"
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # GATE 1 -- secrets. Blocks everything downstream.
  # ===========================================================================
  secret-scan:
    name: Secrets
    # Runs on the LOWEST-trust runner. Secret scanning only ever reads source;
    # it needs no cloud access, so it has none.
    runs-on: [self-hosted, dev]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. The default shallow clone fetches one commit, so a secret
          # committed earlier and deleted later -- the case that actually
          # matters -- would be invisible. This single line is the difference
          # between a working secret scanner and a decorative one.
          fetch-depth: 0

      # Deliberately NOT gitleaks-action. On a push it scans only the pushed
      # commit RANGE, which on a repository's first push is
      # `<first-commit>^..HEAD` -- and the first commit has no parent. git
      # errors, the scan covers ZERO bytes, and the action still prints
      # "no leaks found".
      #
      # A scanner that reports a pass while scanning nothing is worse than no
      # scanner, because it manufactures confidence. So: pin the version, scan
      # the whole repository every time, and let it be slightly slower.
      - name: Confirm the pinned gitleaks is present
        run: gitleaks version

      - name: Scan the entire repository history
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload gitleaks SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ===========================================================================
  # GATE 2 -- infrastructure as code, per environment.
  # ===========================================================================
  iac-scan:
    name: IaC (${{ matrix.environment }})
    # Each environment is scanned on its OWN runner, in its own container.
    # A pull request touching dev never executes on the machine that deploys
    # production -- that is the isolation boundary, and it is why there are
    # three runners rather than one.
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    needs: secret-scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    strategy:
      fail-fast: false # scan every environment, do not stop at the first failure
      matrix:
        environment: [dev, stage, prod]
    steps:
      - uses: actions/checkout@v4

      # No setup-python / setup-terraform here. The runner image already has
      # pinned Terraform and gitleaks, so a build cannot silently pick up a
      # different toolchain version than the one that was reviewed.
      #
      # Debian 13 marks the system Python as externally managed (PEP 668), so
      # pip refuses to install into it. A venv is the correct answer -- never
      # --break-system-packages, which is how a runner's Python slowly rots.
      - name: Python tooling (venv)
        run: |
          python3 -m venv .ci-venv
          ./.ci-venv/bin/pip install --quiet --upgrade pip
          ./.ci-venv/bin/pip install --quiet checkov anthropic
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Terraform format
        run: terraform fmt -check -recursive terraform/

      # Decrypts with the age key that exists ONLY on this runner. The dev
      # runner physically cannot read stage or prod credentials, so a
      # compromised dev build gains nothing by reading the encrypted file --
      # which is committed, in the open, on purpose.
      - name: Decrypt state credentials (SOPS)
        id: sops
        working-directory: terraform/envs/${{ matrix.environment }}
        env:
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          eval "$(sops --decrypt secrets.enc.yaml \
            | sed -n 's/^\([a-z_]*\): \(.*\)$/TF_\U\1\E="\2"/p')"
          # masked so it cannot appear in a log, even on failure
          echo "::add-mask::${TF_PASSWORD}"
          CONN="postgres://${TF_USERNAME}:${TF_PASSWORD}@${TF_HOST}/${TF_DATABASE}?sslmode=disable"
          echo "::add-mask::${CONN}"
          echo "conn_str=${CONN}" >> "$GITHUB_OUTPUT"
          echo "Decrypted credentials for ${TF_DATABASE} as ${TF_USERNAME}"

      - name: Terraform init against remote state
        working-directory: terraform/envs/${{ matrix.environment }}
        run: |
          terraform init -input=false \
            -backend-config="conn_str=${{ steps.sops.outputs.conn_str }}"

      - name: Terraform validate
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform validate

      # continue-on-error so a finding does not kill the job before triage has
      # had a chance to explain it. The gate is ai_triage.py --fail-on-blocking,
      # not checkov's own exit code.
      - name: Checkov
        continue-on-error: true
        run: |
          checkov -d terraform/envs/${{ matrix.environment }} \
            --output json --output-file-path checkov-report \
            --soft-fail
          checkov -d terraform/envs/${{ matrix.environment }} \
            --output sarif --output-file-path . --soft-fail

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov-${{ matrix.environment }}

      - name: AI triage
        id: triage
        continue-on-error: true
        env:
          # Optional. Absent, the script produces the same report from local
          # rules -- so the gate never depends on an external API being up.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/ai_triage.py \
            --input checkov-report/results_json.json \
            --environment ${{ matrix.environment }} \
            --output triage-${{ matrix.environment }}.md \
            --fail-on-blocking

      - name: Comment on the PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: triage-${{ matrix.environment }}.md

      - name: Enforce the gate
        if: steps.triage.outcome == 'failure'
        run: |
          echo "::error::Blocking findings for ${{ matrix.environment }}. See the PR comment."
          exit 1

  # ===========================================================================
  # DEPLOY -- the part that actually creates infrastructure.
  #
  # dev applies automatically on merge. stage and prod are gated by a required
  # reviewer on the GitHub Environment, so promotion is a decision rather than
  # a side effect of a merge.
  # ===========================================================================
  deploy:
    name: Deploy (${{ matrix.environment }})
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    needs: [secret-scan, iac-scan]
    # push to main deploys every environment; a manual run deploys just the one
    # you pick, which is what makes a live single-environment demo clean.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    strategy:
      fail-fast: false
      max-parallel: 1        # dev, then stage, then prod
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev","stage","prod"]') }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt credentials (SOPS)
        id: sops
        working-directory: terraform/deploy/${{ matrix.environment }}
        env:
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          eval "$(sops --decrypt ../../envs/${{ matrix.environment }}/secrets.enc.yaml \
            | sed -n 's/^\([a-z_]*\): \(.*\)$/S_\U\1\E="\2"/p')"
          for v in "$S_PASSWORD" "$S_PVE_TOKEN_SECRET"; do echo "::add-mask::$v"; done
          CONN="postgres://${S_USERNAME}:${S_PASSWORD}@${S_HOST}/${S_DATABASE}?sslmode=disable"
          echo "::add-mask::$CONN"
          {
            echo "conn_str=$CONN"
            echo "pve_endpoint=$S_PVE_ENDPOINT"
            echo "pve_token_id=$S_PVE_TOKEN_ID"
            echo "pve_token_secret=$S_PVE_TOKEN_SECRET"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: terraform/deploy/${{ matrix.environment }}
        run: |
          terraform init -input=false \
            -backend-config="conn_str=${{ steps.sops.outputs.conn_str }}"

      - name: Terraform plan
        working-directory: terraform/deploy/${{ matrix.environment }}
        env:
          TF_VAR_pve_endpoint: ${{ steps.sops.outputs.pve_endpoint }}
          TF_VAR_pve_token_id: ${{ steps.sops.outputs.pve_token_id }}
          TF_VAR_pve_token_secret: ${{ steps.sops.outputs.pve_token_secret }}
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -json tfplan > plan.json

      # Checkov has no Proxmox coverage, so this code would otherwise pass every
      # scan by being unrecognised -- a control that inspects nothing and
      # reports success. The policy is written against the PLAN, which is what
      # will actually be created.
      - name: Deploy policy gate
        working-directory: terraform/deploy/${{ matrix.environment }}
        run: |
          python3 ../../../scripts/policy_check.py \
            --plan plan.json \
            --environment ${{ matrix.environment }}

      - name: Terraform apply
        working-directory: terraform/deploy/${{ matrix.environment }}
        env:
          TF_VAR_pve_endpoint: ${{ steps.sops.outputs.pve_endpoint }}
          TF_VAR_pve_token_id: ${{ steps.sops.outputs.pve_token_id }}
          TF_VAR_pve_token_secret: ${{ steps.sops.outputs.pve_token_secret }}
        run: terraform apply -input=false -no-color tfplan

      - name: What is running
        working-directory: terraform/deploy/${{ matrix.environment }}
        run: terraform output -no-color
