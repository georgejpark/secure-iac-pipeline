name: Security Pipeline

# Gates every change to the claims platform before it can reach an AWS account.
#
# Two properties this pipeline is designed around:
#
#   1. Secret scanning runs FIRST and ALONE. A leaked credential is already an
#      incident by the time CI sees it; a Terraform misconfiguration is still
#      only a proposal. They do not deserve the same urgency.
#
#   2. There are NO long-lived AWS credentials anywhere in this repository.
#      Authentication is GitHub OIDC federation -- GitHub mints a short-lived
#      token, AWS trusts it for one specific repo/branch, and it expires in an
#      hour. There is nothing in `secrets` for an attacker to steal.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan against"
        required: true
        default: dev
        type: choice
        options: [dev, stage, prod]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.5.7"
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # GATE 1 -- secrets. Blocks everything downstream.
  # ===========================================================================
  secret-scan:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. The default shallow clone fetches one commit, so a secret
          # committed earlier and deleted later -- the case that actually
          # matters -- would be invisible. This single line is the difference
          # between a working secret scanner and a decorative one.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # GATE 2 -- infrastructure as code, per environment.
  # ===========================================================================
  iac-scan:
    name: IaC (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    strategy:
      fail-fast: false # scan every environment, do not stop at the first failure
      matrix:
        environment: [dev, stage, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet checkov anthropic

      - name: Terraform format
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate
        working-directory: terraform/envs/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # continue-on-error so a finding does not kill the job before triage has
      # had a chance to explain it. The gate is ai_triage.py --fail-on-blocking,
      # not checkov's own exit code.
      - name: Checkov
        continue-on-error: true
        run: |
          checkov -d terraform/envs/${{ matrix.environment }} \
            --output json --output-file-path checkov-report \
            --soft-fail
          checkov -d terraform/envs/${{ matrix.environment }} \
            --output sarif --output-file-path . --soft-fail

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov-${{ matrix.environment }}

      - name: AI triage
        id: triage
        continue-on-error: true
        env:
          # Optional. Absent, the script produces the same report from local
          # rules -- so the gate never depends on an external API being up.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/ai_triage.py \
            --input checkov-report/results_json.json \
            --environment ${{ matrix.environment }} \
            --output triage-${{ matrix.environment }}.md \
            --fail-on-blocking

      - name: Comment on the PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: triage-${{ matrix.environment }}.md

      - name: Enforce the gate
        if: steps.triage.outcome == 'failure'
        run: |
          echo "::error::Blocking findings for ${{ matrix.environment }}. See the PR comment."
          exit 1

  # ===========================================================================
  # PLAN -- only after both gates pass. Uses OIDC, never a stored AWS key.
  # ===========================================================================
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [secret-scan, iac-scan]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stage, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # No access key, no secret key, nothing long-lived. GitHub presents a
      # signed OIDC token; the AWS role's trust policy accepts it only for this
      # repository and only for the matching environment. Credentials last
      # about an hour and cannot be exfiltrated from `secrets`.
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ matrix.environment }}-${{ github.run_id }}

      - name: Terraform plan
        working-directory: terraform/envs/${{ matrix.environment }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan

  # ===========================================================================
  # APPLY -- dev on merge. stage and prod require a reviewer on the GitHub
  # Environment, so promotion is a human decision, not a side effect of a merge.
  # ===========================================================================
  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    needs: [secret-scan, iac-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-dev-${{ github.run_id }}
      - name: Terraform apply
        working-directory: terraform/envs/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
